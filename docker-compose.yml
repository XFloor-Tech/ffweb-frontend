version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ffweb-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Internal port only, system nginx proxies to this
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  frontend-network:
    driver: bridge
